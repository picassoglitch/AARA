<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0a09">
  <meta name="description" content="if you found this, you were already close.">
  <meta name="robots" content="index, follow">
  <title>ara</title>
  <link rel="preload" href="/fonts/cormorant-garamond-light.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/eb-garamond-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="room" id="room">
    <div class="artwork-container" id="artworkContainer">
      <div class="loader" id="loader"></div>
      <div class="artwork-frame hidden" id="artworkFrame">
        <img class="artwork-image" id="artworkImage" alt="" decoding="async">
      </div>
    </div>
    
    <p class="state-message hidden" id="stateMessage"></p>
    
    <p class="placard" id="placard"></p>
    
    <form class="invitation" id="waitlistForm">
      <div class="invitation-field">
        <input 
          type="text"
          inputmode="email"
          autocomplete="email"
          class="invitation-input" 
          id="contact" 
          name="contact"
          placeholder=" "
          required
          aria-describedby="invitationLabel"
        >
        <button type="submit" class="invitation-submit" aria-label="submit request">→</button>
        <input type="text" name="website" class="honeypot" tabindex="-1" autocomplete="off" aria-hidden="true">
        <input type="hidden" name="ref" id="refInput">
      </div>
      <label class="invitation-label" id="invitationLabel" for="contact">request</label>
    </form>
    
    <span class="crest" aria-hidden="true">ixiptla</span>
  </div>

  <script>
    (function() {
      var room = document.getElementById('room');
      var loader = document.getElementById('loader');
      var artworkContainer = document.getElementById('artworkContainer');
      var artworkFrame = document.getElementById('artworkFrame');
      var artworkImage = document.getElementById('artworkImage');
      var stateMessage = document.getElementById('stateMessage');
      var placard = document.getElementById('placard');
      var form = document.getElementById('waitlistForm');
      var input = document.getElementById('contact');
      var label = document.getElementById('invitationLabel');
      var refInput = document.getElementById('refInput');
      
      var params = new URLSearchParams(window.location.search);
      var ref = params.get('ref');
      
      if (ref) {
        refInput.value = ref;
        fetch('/api/campaign/' + encodeURIComponent(ref) + '/click', {
          method: 'POST',
          credentials: 'same-origin'
        }).catch(function() {});
      }

      function showState(msg) {
        loader.classList.add('hidden');
        stateMessage.textContent = msg;
        stateMessage.classList.remove('hidden');
        form.classList.add('hidden');
      }

      function showArtwork(data) {
        loader.classList.add('hidden');
        artworkFrame.classList.remove('hidden');
        
        artworkImage.alt = data.title || 'artwork';
        artworkImage.src = data.imageUrl;
        
        if (artworkImage.decode) {
          artworkImage.decode().then(function() {
            artworkImage.classList.add('loaded');
            placard.textContent = data.date + ' · ' + data.title;
            placard.classList.add('visible');
            form.classList.add('visible');
          }).catch(function() {
            artworkImage.classList.add('loaded');
            placard.textContent = data.date + ' · ' + data.title;
            placard.classList.add('visible');
            form.classList.add('visible');
          });
        } else {
          artworkImage.onload = function() {
            artworkImage.classList.add('loaded');
            placard.textContent = data.date + ' · ' + data.title;
            placard.classList.add('visible');
            form.classList.add('visible');
          };
        }
      }

      fetch('/api/artwork/current')
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (data.artwork) {
            showArtwork(data.artwork);
          } else {
            showState('nothing hangs here today.');
          }
        })
        .catch(function() {
          showState('closed.');
        });

      function isValidEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) && email.length <= 254;
      }

      var errorTimeout;
      function showError(msg) {
        label.textContent = msg;
        label.classList.add('error');
        clearTimeout(errorTimeout);
        errorTimeout = setTimeout(function() {
          label.textContent = 'request';
          label.classList.remove('error');
        }, 4000);
      }

      function fadeAndNavigate(url) {
        room.classList.add('fade-out');
        setTimeout(function() {
          window.location.href = url;
        }, 800);
      }

      form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        var email = input.value.trim();
        if (!email) {
          showError('not quite.');
          return;
        }
        if (!isValidEmail(email)) {
          showError('not quite.');
          return;
        }
        
        var formData = new FormData(form);
        
        fetch('/api/waitlist', {
          method: 'POST',
          body: formData,
          credentials: 'same-origin'
        })
          .then(function(res) { return res.json().then(function(d) { return { ok: res.ok, data: d }; }); })
          .then(function(result) {
            if (result.ok) {
              fadeAndNavigate('/queued.html?id=' + encodeURIComponent(result.data.token) + '&pos=' + result.data.position);
            } else {
              showError(result.data.error === 'already registered.' ? 'already here.' : 'not quite.');
            }
          })
          .catch(function() {
            showError('closed.');
          });
      });

      var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reducedMotion) {
        document.querySelectorAll('.loader').forEach(function(el) {
          el.style.animation = 'none';
          el.style.opacity = '0.4';
        });
      }
    })();
  </script>
</body>
</html>
