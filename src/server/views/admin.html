<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0a09">
  <meta name="robots" content="noindex, nofollow">
  <title>ara</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="admin-page">
    <div class="admin-container">
      <h1 class="admin-title">ara</h1>
      
      <div id="loginSection">
        <div class="admin-login">
          <form id="loginForm">
            <div class="admin-login-field">
              <label class="admin-label" for="passwordInput">password</label>
              <input type="password" class="admin-input" id="passwordInput" autocomplete="current-password">
            </div>
            <button type="submit" class="admin-btn">enter</button>
            <p class="admin-error hidden" id="loginError"></p>
          </form>
        </div>
      </div>
      
      <div id="adminSection" class="hidden">
        <div class="admin-tabs">
          <button class="admin-tab active" data-tab="artworks">artworks</button>
          <button class="admin-tab" data-tab="waitlist">waitlist</button>
          <button class="admin-tab" data-tab="campaigns">campaigns</button>
        </div>
        
        <div id="artworksTab" class="admin-section active">
          <h2 class="admin-heading">current work</h2>
          <div id="currentWork"></div>
          
          <h2 class="admin-heading">upload</h2>
          <form id="uploadForm">
            <div class="admin-field">
              <label class="admin-label" for="fileInput">image</label>
              <input type="file" class="admin-input" id="fileInput" accept="image/*">
            </div>
            <div class="admin-field">
              <label class="admin-label" for="dateInput">date</label>
              <input type="text" class="admin-input" id="dateInput" placeholder="2026.10.01">
            </div>
            <div class="admin-field">
              <label class="admin-label" for="titleInput">title</label>
              <input type="text" class="admin-input" id="titleInput" placeholder="untitled">
            </div>
            <button type="submit" class="admin-btn">upload</button>
            <p class="admin-error hidden" id="uploadError"></p>
            <p class="admin-success hidden" id="uploadSuccess"></p>
          </form>
          
          <h2 class="admin-heading">all artworks</h2>
          <table class="admin-table" id="artworksTable">
            <thead><tr><th></th><th>date</th><th>title</th><th>status</th><th></th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
        
        <div id="waitlistTab" class="admin-section">
          <h2 class="admin-heading">queue</h2>
          <p style="color:var(--bone-44);font-size:11px;margin-bottom:16px;letter-spacing:0.02em;">ordering: whitelisted first, then engagement score, then signup time</p>
          <table class="admin-table" id="waitlistTable">
            <thead><tr><th>#</th><th>contact</th><th>name</th><th>likes</th><th>shares</th><th>tags</th><th>source</th><th>flags</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
        
        <div id="campaignsTab" class="admin-section">
          <h2 class="admin-heading">create campaign</h2>
          <form id="campaignForm">
            <div class="admin-field">
              <label class="admin-label" for="campaignLabel">label</label>
              <input type="text" class="admin-input" id="campaignLabel" placeholder="instagram post oct 1">
            </div>
            <div class="admin-field">
              <label class="admin-label" for="campaignUrl">source url</label>
              <input type="text" class="admin-input" id="campaignUrl" placeholder="https://instagram.com/p/...">
            </div>
            <button type="submit" class="admin-btn">create</button>
            <p class="admin-error hidden" id="campaignError"></p>
          </form>
          
          <h2 class="admin-heading">campaigns</h2>
          <table class="admin-table" id="campaignsTable">
            <thead><tr><th>label</th><th>short link</th><th>clicks</th><th>unique</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
        
        <div style="margin-top:48px;">
          <button class="admin-btn admin-btn--danger" id="logoutBtn">logout</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      var adminPath = window.ADMIN_PATH || location.pathname.split('/').pop().replace('.html', '');
      var csrfToken = '';
      
      function api(method, path, body) {
        var opts = {
          method: method,
          credentials: 'same-origin',
          headers: {}
        };
        if (csrfToken) {
          opts.headers['x-csrf-token'] = csrfToken;
        }
        if (body && !(body instanceof FormData)) {
          opts.headers['Content-Type'] = 'application/json';
          opts.body = JSON.stringify(body);
        } else if (body) {
          opts.body = body;
        }
        return fetch('/' + adminPath + path, opts).then(function(r) { 
          return r.json().then(function(d) { return { ok: r.ok, data: d }; }); 
        });
      }
      
      function checkAuth() {
        api('GET', '/session').then(function(r) {
          if (r.data.authenticated) {
            csrfToken = r.data.csrfToken;
            showAdmin();
          } else {
            csrfToken = r.data.csrfToken;
          }
        });
      }
      
      function showAdmin() {
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('adminSection').classList.remove('hidden');
        loadArtworks();
        loadWaitlist();
        loadCampaigns();
      }
      
      document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var errEl = document.getElementById('loginError');
        errEl.classList.add('hidden');
        
        var formData = new FormData();
        formData.append('password', document.getElementById('passwordInput').value);
        formData.append('_csrf', csrfToken);
        
        api('POST', '/login', formData).then(function(r) {
          if (r.ok) {
            csrfToken = r.data.csrfToken;
            showAdmin();
          } else {
            errEl.textContent = r.data.error;
            errEl.classList.remove('hidden');
          }
        });
      });
      
      document.getElementById('logoutBtn').addEventListener('click', function() {
        if (confirm('logout?')) {
          api('POST', '/logout').then(function() {
            location.reload();
          });
        }
      });
      
      document.querySelectorAll('.admin-tab').forEach(function(tab) {
        tab.addEventListener('click', function() {
          document.querySelectorAll('.admin-tab').forEach(function(t) { t.classList.remove('active'); });
          tab.classList.add('active');
          document.querySelectorAll('.admin-section').forEach(function(s) { s.classList.remove('active'); });
          document.getElementById(tab.dataset.tab + 'Tab').classList.add('active');
        });
      });
      
      function loadArtworks() {
        api('GET', '/artworks').then(function(r) {
          if (!r.ok) return;
          
          var current = r.data.artworks.find(function(a) { return a.is_current; });
          var currentEl = document.getElementById('currentWork');
          if (current) {
            currentEl.innerHTML = '<div style="display:flex;align-items:center;gap:16px;margin-bottom:24px;">' +
              '<img class="admin-preview" src="' + current.imageUrl + '" alt="">' +
              '<div><div style="color:var(--bone-72);">' + current.date + ' · ' + current.title + '</div>' +
              '<div class="admin-current">current</div></div></div>';
          } else {
            currentEl.innerHTML = '<p style="color:var(--bone-44);font-size:13px;">no current artwork set.</p>';
          }
          
          var tbody = document.querySelector('#artworksTable tbody');
          tbody.innerHTML = r.data.artworks.map(function(a) {
            return '<tr>' +
              '<td><img class="admin-preview" src="' + a.imageUrl + '" alt=""></td>' +
              '<td>' + a.date + '</td>' +
              '<td>' + a.title + '</td>' +
              '<td>' + (a.is_current ? '<span class="admin-current">current</span>' : '') + '</td>' +
              '<td>' + (a.is_current ? '' : '<button class="admin-btn" onclick="setCurrent(' + a.id + ')">set current</button>') + '</td>' +
            '</tr>';
          }).join('');
        });
      }
      
      window.setCurrent = function(id) {
        api('POST', '/artworks/' + id + '/set-current').then(function() {
          loadArtworks();
        });
      };
      
      document.getElementById('uploadForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var errEl = document.getElementById('uploadError');
        var successEl = document.getElementById('uploadSuccess');
        errEl.classList.add('hidden');
        successEl.classList.add('hidden');
        
        var formData = new FormData();
        formData.append('file', document.getElementById('fileInput').files[0]);
        formData.append('date', document.getElementById('dateInput').value);
        formData.append('title', document.getElementById('titleInput').value);
        formData.append('_csrf', csrfToken);
        
        api('POST', '/artworks', formData).then(function(r) {
          if (r.ok) {
            successEl.textContent = 'uploaded.';
            successEl.classList.remove('hidden');
            document.getElementById('uploadForm').reset();
            loadArtworks();
          } else {
            errEl.textContent = r.data.error;
            errEl.classList.remove('hidden');
          }
        });
      });
      
      function loadWaitlist() {
        api('GET', '/waitlist').then(function(r) {
          if (!r.ok) return;
          var tbody = document.querySelector('#waitlistTable tbody');
          tbody.innerHTML = r.data.entries.map(function(e) {
            return '<tr>' +
              '<td>' + e.position + '</td>' +
              '<td class="mono">' + e.contact + '</td>' +
              '<td>' + (e.display_name || '—') + '</td>' +
              '<td><input class="admin-inline-input" type="number" value="' + e.engagement_likes + '" onchange="updateEntry(' + e.id + ', \'engagement_likes\', this.value)"></td>' +
              '<td><input class="admin-inline-input" type="number" value="' + e.engagement_shares + '" onchange="updateEntry(' + e.id + ', \'engagement_shares\', this.value)"></td>' +
              '<td><input class="admin-inline-input" type="number" value="' + e.engagement_tags + '" onchange="updateEntry(' + e.id + ', \'engagement_tags\', this.value)"></td>' +
              '<td>' + (e.campaign_id || '—') + '</td>' +
              '<td>' + (e.is_whitelisted ? '<span class="admin-tag">wl</span>' : '') + '</td>' +
            '</tr>';
          }).join('');
        });
      }
      
      window.updateEntry = function(id, field, value) {
        var body = {};
        body[field] = parseInt(value, 10);
        api('PUT', '/waitlist/' + id, body).then(function() {
          loadWaitlist();
        });
      };
      
      function loadCampaigns() {
        api('GET', '/campaigns').then(function(r) {
          if (!r.ok) return;
          var tbody = document.querySelector('#campaignsTable tbody');
          tbody.innerHTML = r.data.campaigns.map(function(c) {
            var shortUrl = location.origin + '/c/' + c.short_code;
            return '<tr>' +
              '<td>' + c.label + '</td>' +
              '<td class="mono" style="cursor:pointer;" onclick="navigator.clipboard.writeText(\'' + shortUrl + '\')" title="click to copy">' + shortUrl + '</td>' +
              '<td>' + c.click_count + '</td>' +
              '<td>' + c.unique_clicks + '</td>' +
            '</tr>';
          }).join('');
        });
      }
      
      document.getElementById('campaignForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var errEl = document.getElementById('campaignError');
        errEl.classList.add('hidden');
        
        api('POST', '/campaigns', {
          label: document.getElementById('campaignLabel').value,
          source_url: document.getElementById('campaignUrl').value || null
        }).then(function(r) {
          if (r.ok) {
            document.getElementById('campaignForm').reset();
            loadCampaigns();
          } else {
            errEl.textContent = r.data.error;
            errEl.classList.remove('hidden');
          }
        });
      });
      
      checkAuth();
    })();
  </script>
</body>
</html>
