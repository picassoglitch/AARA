<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>ara admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { 
      height: 100%; 
      background: #0a0a0a; 
      color: #888; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      font-size: 13px;
      line-height: 1.6;
    }
    .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
    h1 { color: #666; font-size: 14px; font-weight: normal; margin-bottom: 40px; }
    h2 { color: #555; font-size: 12px; font-weight: normal; margin: 30px 0 15px; text-transform: uppercase; letter-spacing: 0.1em; }
    
    .login-form { max-width: 300px; }
    .field { margin-bottom: 15px; }
    .field label { display: block; color: #555; font-size: 11px; margin-bottom: 5px; }
    .field input, .field select, .field textarea { 
      width: 100%; 
      background: #111; 
      border: 1px solid #222; 
      color: #888; 
      padding: 8px 10px;
      font-size: 13px;
      font-family: inherit;
    }
    .field input:focus, .field select:focus, .field textarea:focus { 
      outline: none; 
      border-color: #333; 
    }
    button { 
      background: #1a1a1a; 
      border: 1px solid #333; 
      color: #888; 
      padding: 8px 16px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
    }
    button:hover { background: #222; }
    
    .section { margin-bottom: 40px; }
    .error { color: #a55; font-size: 12px; margin-top: 10px; }
    .success { color: #5a5; font-size: 12px; margin-top: 10px; }
    
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #1a1a1a; }
    th { color: #555; font-weight: normal; text-transform: uppercase; letter-spacing: 0.05em; }
    td { color: #777; }
    .mono { font-family: monospace; font-size: 11px; }
    .tag { 
      display: inline-block; 
      background: #1a1a1a; 
      padding: 2px 6px; 
      font-size: 10px; 
      margin-right: 4px;
    }
    .tag.wl { background: #252520; color: #aa8; }
    
    .artwork-preview { width: 60px; height: 60px; object-fit: cover; }
    .current { color: #5a5; }
    
    .tabs { display: flex; gap: 20px; margin-bottom: 30px; }
    .tab { color: #555; cursor: pointer; padding-bottom: 5px; }
    .tab.active { color: #888; border-bottom: 1px solid #444; }
    
    .hidden { display: none; }
    .inline-edit { background: transparent; border: none; border-bottom: 1px solid #333; color: #888; width: 60px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>ara</h1>
    
    <div id="loginSection">
      <form class="login-form" id="loginForm">
        <div class="field">
          <label>password</label>
          <input type="password" id="passwordInput" autocomplete="current-password">
        </div>
        <button type="submit">enter</button>
        <p class="error hidden" id="loginError"></p>
      </form>
    </div>
    
    <div id="adminSection" class="hidden">
      <div class="tabs">
        <span class="tab active" data-tab="artworks">artworks</span>
        <span class="tab" data-tab="waitlist">waitlist</span>
        <span class="tab" data-tab="campaigns">campaigns</span>
      </div>
      
      <div id="artworksTab" class="section">
        <h2>upload</h2>
        <form id="uploadForm">
          <div class="field">
            <label>image</label>
            <input type="file" id="fileInput" accept="image/*">
          </div>
          <div class="field">
            <label>date</label>
            <input type="text" id="dateInput" placeholder="2026.10.01">
          </div>
          <div class="field">
            <label>title</label>
            <input type="text" id="titleInput" placeholder="untitled">
          </div>
          <button type="submit">upload</button>
          <p class="error hidden" id="uploadError"></p>
          <p class="success hidden" id="uploadSuccess"></p>
        </form>
        
        <h2>artworks</h2>
        <table id="artworksTable">
          <thead><tr><th></th><th>date</th><th>title</th><th>status</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      
      <div id="waitlistTab" class="section hidden">
        <h2>queue</h2>
        <p style="color:#555;font-size:11px;margin-bottom:15px;">ordering: whitelisted first, then engagement score, then signup time</p>
        <table id="waitlistTable">
          <thead><tr><th>#</th><th>contact</th><th>name</th><th>likes</th><th>shares</th><th>tags</th><th>source</th><th>flags</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      
      <div id="campaignsTab" class="section hidden">
        <h2>create campaign</h2>
        <form id="campaignForm">
          <div class="field">
            <label>label</label>
            <input type="text" id="campaignLabel" placeholder="instagram post oct 1">
          </div>
          <div class="field">
            <label>source url (optional)</label>
            <input type="text" id="campaignUrl" placeholder="https://instagram.com/p/...">
          </div>
          <button type="submit">create</button>
          <p class="error hidden" id="campaignError"></p>
        </form>
        
        <h2>campaigns</h2>
        <table id="campaignsTable">
          <thead><tr><th>label</th><th>short link</th><th>clicks</th><th>unique</th><th>signups</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      
      <p style="margin-top:40px;"><button id="logoutBtn">logout</button></p>
    </div>
  </div>

  <script>
    (function() {
      var adminPath = window.ADMIN_PATH || location.pathname.split('/').pop().replace('.html', '');
      var csrfToken = '';
      
      function api(method, path, body) {
        var opts = {
          method: method,
          credentials: 'same-origin',
          headers: {}
        };
        if (csrfToken) {
          opts.headers['x-csrf-token'] = csrfToken;
        }
        if (body && !(body instanceof FormData)) {
          opts.headers['Content-Type'] = 'application/json';
          opts.body = JSON.stringify(body);
        } else if (body) {
          opts.body = body;
        }
        return fetch('/' + adminPath + path, opts).then(function(r) { 
          return r.json().then(function(d) { return { ok: r.ok, data: d }; }); 
        });
      }
      
      function checkAuth() {
        api('GET', '/session').then(function(r) {
          if (r.data.authenticated) {
            csrfToken = r.data.csrfToken;
            showAdmin();
          } else {
            csrfToken = r.data.csrfToken;
          }
        });
      }
      
      function showAdmin() {
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('adminSection').classList.remove('hidden');
        loadArtworks();
        loadWaitlist();
        loadCampaigns();
      }
      
      document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var errEl = document.getElementById('loginError');
        errEl.classList.add('hidden');
        
        var formData = new FormData();
        formData.append('password', document.getElementById('passwordInput').value);
        formData.append('_csrf', csrfToken);
        
        api('POST', '/login', formData).then(function(r) {
          if (r.ok) {
            csrfToken = r.data.csrfToken;
            showAdmin();
          } else {
            errEl.textContent = r.data.error;
            errEl.classList.remove('hidden');
          }
        });
      });
      
      document.getElementById('logoutBtn').addEventListener('click', function() {
        api('POST', '/logout').then(function() {
          location.reload();
        });
      });
      
      document.querySelectorAll('.tab').forEach(function(tab) {
        tab.addEventListener('click', function() {
          document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
          tab.classList.add('active');
          document.querySelectorAll('.section').forEach(function(s) { s.classList.add('hidden'); });
          document.getElementById(tab.dataset.tab + 'Tab').classList.remove('hidden');
        });
      });
      
      function loadArtworks() {
        api('GET', '/artworks').then(function(r) {
          if (!r.ok) return;
          var tbody = document.querySelector('#artworksTable tbody');
          tbody.innerHTML = r.data.artworks.map(function(a) {
            return '<tr>' +
              '<td><img class="artwork-preview" src="' + a.imageUrl + '"></td>' +
              '<td>' + a.date + '</td>' +
              '<td>' + a.title + '</td>' +
              '<td>' + (a.is_current ? '<span class="current">current</span>' : '') + '</td>' +
              '<td>' + (a.is_current ? '' : '<button onclick="setCurrent(' + a.id + ')">set current</button>') + '</td>' +
            '</tr>';
          }).join('');
        });
      }
      
      window.setCurrent = function(id) {
        api('POST', '/artworks/' + id + '/set-current').then(function() {
          loadArtworks();
        });
      };
      
      document.getElementById('uploadForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var errEl = document.getElementById('uploadError');
        var successEl = document.getElementById('uploadSuccess');
        errEl.classList.add('hidden');
        successEl.classList.add('hidden');
        
        var formData = new FormData();
        formData.append('file', document.getElementById('fileInput').files[0]);
        formData.append('date', document.getElementById('dateInput').value);
        formData.append('title', document.getElementById('titleInput').value);
        formData.append('_csrf', csrfToken);
        
        api('POST', '/artworks', formData).then(function(r) {
          if (r.ok) {
            successEl.textContent = 'uploaded.';
            successEl.classList.remove('hidden');
            document.getElementById('uploadForm').reset();
            loadArtworks();
          } else {
            errEl.textContent = r.data.error;
            errEl.classList.remove('hidden');
          }
        });
      });
      
      function loadWaitlist() {
        api('GET', '/waitlist').then(function(r) {
          if (!r.ok) return;
          var tbody = document.querySelector('#waitlistTable tbody');
          tbody.innerHTML = r.data.entries.map(function(e) {
            return '<tr>' +
              '<td>' + e.position + '</td>' +
              '<td class="mono">' + e.contact + '</td>' +
              '<td>' + (e.display_name || '-') + '</td>' +
              '<td><input class="inline-edit" type="number" value="' + e.engagement_likes + '" onchange="updateEntry(' + e.id + ', \'engagement_likes\', this.value)"></td>' +
              '<td><input class="inline-edit" type="number" value="' + e.engagement_shares + '" onchange="updateEntry(' + e.id + ', \'engagement_shares\', this.value)"></td>' +
              '<td><input class="inline-edit" type="number" value="' + e.engagement_tags + '" onchange="updateEntry(' + e.id + ', \'engagement_tags\', this.value)"></td>' +
              '<td>' + (e.campaign_id || '-') + '</td>' +
              '<td>' + (e.is_whitelisted ? '<span class="tag wl">wl</span>' : '') + '</td>' +
            '</tr>';
          }).join('');
        });
      }
      
      window.updateEntry = function(id, field, value) {
        var body = {};
        body[field] = parseInt(value, 10);
        api('PUT', '/waitlist/' + id, body).then(function() {
          loadWaitlist();
        });
      };
      
      function loadCampaigns() {
        api('GET', '/campaigns').then(function(r) {
          if (!r.ok) return;
          var tbody = document.querySelector('#campaignsTable tbody');
          tbody.innerHTML = r.data.campaigns.map(function(c) {
            var shortUrl = location.origin + '/c/' + c.short_code;
            return '<tr>' +
              '<td>' + c.label + '</td>' +
              '<td class="mono">' + shortUrl + '</td>' +
              '<td>' + c.click_count + '</td>' +
              '<td>' + c.unique_clicks + '</td>' +
              '<td>-</td>' +
            '</tr>';
          }).join('');
        });
      }
      
      document.getElementById('campaignForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var errEl = document.getElementById('campaignError');
        errEl.classList.add('hidden');
        
        api('POST', '/campaigns', {
          label: document.getElementById('campaignLabel').value,
          source_url: document.getElementById('campaignUrl').value || null
        }).then(function(r) {
          if (r.ok) {
            document.getElementById('campaignForm').reset();
            loadCampaigns();
          } else {
            errEl.textContent = r.data.error;
            errEl.classList.remove('hidden');
          }
        });
      });
      
      checkAuth();
    })();
  </script>
</body>
</html>
